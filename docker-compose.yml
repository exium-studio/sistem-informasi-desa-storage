services:
    sistem-informasi-desa-dokumen:
        build:
            context: ./vendor/laravel/sail/runtimes/8.2
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP}"
        image: sid-storage-app
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "${APP_PORT:-8001}:80"
            - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
        environment:
            WWWUSER: "${WWWUSER}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - "/mnt/d/__EXIUM_PROJECT__/microservices/SISTEM_INFORMASI_DESA/sistem_informasi_desa_dokumen:/var/www/html"
        networks:
            - sid-storage-network
        depends_on:
            pgsql:
                condition: service_healthy
    pgsql:
        image: "postgres:17"
        ports:
            - "5433:5432"
        environment:
            PGPASSWORD: "${DB_PASSWORD:-secret}"
            POSTGRES_DB: "${DB_DATABASE}"
            POSTGRES_USER: "${DB_USERNAME}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
        volumes:
            - "sail-pgsql-sid-dokumen:/var/lib/postgresql/data"
            - "./vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql"
        networks:
            - sid-storage-network
        healthcheck:
            test:
                - CMD
                - pg_isready
                - "-q"
                - "-d"
                - "${DB_DATABASE}"
                - "-U"
                - "${DB_USERNAME}"
            interval: 10s
            retries: 5
            timeout: 5s
networks:
    sid-storage-network:
        driver: bridge
    sid-global-network:
        driver: bridge 
volumes:
    sail-pgsql-sid-dokumen:
        driver: local
